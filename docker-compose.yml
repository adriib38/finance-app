services:
  db:
    image: mariadb:10.6
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-finance}
      MYSQL_USER: ${DB_USER:-finance}
      MYSQL_PASSWORD: ${DB_PASSWORD:-finance}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-finance}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - finance-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: ${PORT:-4000}
      # Dentro de la red de docker compose el host de la BD es el nombre del
      # servicio ("db"), no localhost.
      DB_HOST: db
      DB_USER: ${DB_USER:-finance}
      DB_PASSWORD: ${DB_PASSWORD:-finance}
      DB_DATABASE: ${DB_DATABASE:-finance}
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      SALT_ROUNDS: ${SALT_ROUNDS:-10}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?falta ADMIN_PASSWORD en .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      DB_RO_USER: ${DB_RO_USER:-}
      DB_RO_PASSWORD: ${DB_RO_PASSWORD:-}
    ports:
      - "${PORT:-4000}:${PORT:-4000}"

volumes:
  finance-db-data:
